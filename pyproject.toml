[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "docx-tools"
version = "0.1.0"
description = "Paragraph-level Word document editing API and MCP server for AI assistants"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "lxml>=5.0.0",
    "mcp[cli]>=1.0.0",
]

[project.scripts]
docx-mcp-server = "docx_tools.server:mcp.run"

[tool.setuptools.packages.find]
where = ["."]
include = ["docx_tools*"]
exclude = [".venv*"]
